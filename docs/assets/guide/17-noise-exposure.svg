<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 590" width="800" height="590" role="img" aria-labelledby="title desc" font-family="Heebo, Rubik, Arial, sans-serif">
<title id="title">כמה זמן אפשר לשמוע בכל עוצמה</title>
<desc id="desc">זמן חשיפה יומי מותר לפי המלצת NIOSH: 85 dBA ל-8 שעות, וכל תוספת של 3 dB חוצה את הזמן.</desc>
