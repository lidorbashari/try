<text x="400.0" y="76.0" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="middle" direction="rtl">‎85 dBA ל-8 שעות · כל ‎+3 dB = חצי מהזמן · פלאגים של ‎−20 dB מחזירים לכם שעות</text>
