<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>מעבדת המשאפים</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Mashup Lab v5. Visual language: "two liquids, one glass".
   Pink (vocal, deck A) and blue (beat, deck B) are the only two expressive colors; wherever a mashup
   appears they meet. Glass is reserved for what floats (tab bar, mini-player, sheets, search, header
   button); content surfaces stay solid and calm. The only ambient motion is the Mashup Orb, and only
   while music plays. */
:root {
  color-scheme: light;
  --bg: #ffffff;
  --card: #f4f4f7;
  --card-hi: #ffffff;
  --fill: rgba(120,120,128,.12);
  --fill-2: rgba(120,120,128,.07);
  --fill-3: rgba(120,120,128,.22);
  --label: #000000;
  --label-2: rgba(60,60,67,.66);
  --label-3: rgba(60,60,67,.36);
  --sep: rgba(60,60,67,.14);
  --accent: #fa2d48;
  --accent-ink: #dc1c3f;
  --accent-tint: rgba(250,45,72,.1);
  --vocal: #ff375f; --vocal-strong: #e11d48; --vocal-ink: #cc1240; --vocal-tint: rgba(255,55,95,.11);
  --beat: #32ade6; --beat-strong: #0b78b3; --beat-ink: #0a6c9e; --beat-tint: rgba(50,173,230,.13);
  --violet: #8e5cf7; --violet-ink: #6a3fd6; --violet-tint: rgba(142,92,247,.12);
  --good: #34c759; --good-ink: #1d8139; --good-tint: rgba(52,199,89,.15);
  --ok: #0a84ff; --ok-ink: #0062cc; --ok-tint: rgba(10,132,255,.12);
  --warn: #ff9f0a; --warn-ink: #a55400; --warn-tint: rgba(255,159,10,.16);
  --en-warm: #0b7f96; --en-warm-t: rgba(48,176,199,.15); --en-peak: #c2410c; --en-peak-t: rgba(255,112,40,.14);
  --bar-glass: rgba(250,250,252,.72);
  --glass: rgba(255,255,255,.58);
  --glass-hi: rgba(255,255,255,.8);
  --glass-edge: rgba(255,255,255,1);
  --glass-edge-2: rgba(255,255,255,.5);
  --glass-line: rgba(0,0,0,.08);
  --glass-shadow: 0 16px 36px -14px rgba(25,25,45,.3), 0 3px 10px -4px rgba(25,25,45,.12);
  --lens: linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,.55));
  --lens-shadow: 0 1px 2px rgba(0,0,0,.08), 0 6px 16px -6px rgba(0,0,0,.22);
  --sheet: rgba(242,242,246,.88);
  --deck: #ffffff;
  --scrim: rgba(0,0,0,.24);
  --behind: #0a0a0c;
  --bubble: #e9e9eb;
  --orb-bg: radial-gradient(circle at 50% 34%, #ffffff 0%, #f3f3f8 55%, #e4e4ee 100%);
  --orb-shadow: 0 30px 60px -28px rgba(70,40,140,.45), 0 10px 22px -12px rgba(0,0,0,.18);
  --logo-blend: multiply;
  --spec: rgba(255,255,255,.85); --lens-spec: rgba(255,255,255,.6);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Hebrew", "Heebo", system-ui, sans-serif;
  --round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "SF Hebrew", "Heebo", system-ui, sans-serif;
  --spring: cubic-bezier(.3,1.35,.45,1);
  --out: cubic-bezier(.2,.8,.2,1);
  --sheet-ease: cubic-bezier(.32,.72,0,1);
  --gut: 16px;
  --tab-h: 62px;
  --tab-b: max(14px, env(safe-area-inset-bottom, 0px));
  --dock: 96px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme=light]) {
    color-scheme: dark;
    --bg: #000000; --card: #1c1c1e; --card-hi: #2c2c2e;
    --fill: rgba(118,118,128,.24); --fill-2: rgba(118,118,128,.16); --fill-3: rgba(118,118,128,.36);
    --label: #ffffff; --label-2: rgba(235,235,245,.64); --label-3: rgba(235,235,245,.32); --sep: rgba(84,84,88,.55);
    --accent-ink: #ff4d68; --accent-tint: rgba(250,45,72,.18);
    --vocal-strong: #e8295a; --vocal-ink: #ff6b8a; --vocal-tint: rgba(255,55,95,.2);
    --beat-strong: #1683bd; --beat-ink: #6dd0ff; --beat-tint: rgba(50,173,230,.2);
    --violet-ink: #b89bff; --violet-tint: rgba(142,92,247,.22);
    --good-ink: #4ade80; --good-tint: rgba(52,199,89,.2); --ok-ink: #5eaeff; --ok-tint: rgba(10,132,255,.22);
    --warn-ink: #ffb84d; --warn-tint: rgba(255,159,10,.2);
    --en-warm: #5ad4ea; --en-warm-t: rgba(64,200,224,.18); --en-peak: #ff9a5c; --en-peak-t: rgba(255,120,50,.2); --bar-glass: rgba(30,30,34,.66);
    --glass: rgba(36,36,40,.55); --glass-hi: rgba(48,48,54,.78); --glass-edge: rgba(255,255,255,.42); --glass-edge-2: rgba(255,255,255,.12);
    --glass-line: rgba(255,255,255,.1); --glass-shadow: 0 16px 40px -12px rgba(0,0,0,.7), 0 2px 8px -2px rgba(0,0,0,.5);
    --lens: linear-gradient(180deg, rgba(255,255,255,.2), rgba(255,255,255,.07));
    --lens-shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 16px -6px rgba(0,0,0,.6);
    --sheet: rgba(20,20,22,.9); --deck: #1c1c1e; --scrim: rgba(0,0,0,.5); --behind: #000000; --bubble: #262629;
    --orb-bg: radial-gradient(circle at 50% 34%, #24242c 0%, #121216 60%, #08080a 100%);
    --orb-shadow: 0 30px 70px -26px rgba(120,80,255,.4), 0 10px 22px -12px rgba(0,0,0,.6);
    --logo-blend: screen;
    --spec: rgba(255,255,255,.16); --lens-spec: rgba(255,255,255,.14);
  }
}
:root[data-theme=dark] {
  color-scheme: dark;
  --bg: #000000; --card: #1c1c1e; --card-hi: #2c2c2e;
  --fill: rgba(118,118,128,.24); --fill-2: rgba(118,118,128,.16); --fill-3: rgba(118,118,128,.36);
  --label: #ffffff; --label-2: rgba(235,235,245,.64); --label-3: rgba(235,235,245,.32); --sep: rgba(84,84,88,.55);
  --accent-ink: #ff4d68; --accent-tint: rgba(250,45,72,.18);
  --vocal-strong: #e8295a; --vocal-ink: #ff6b8a; --vocal-tint: rgba(255,55,95,.2);
  --beat-strong: #1683bd; --beat-ink: #6dd0ff; --beat-tint: rgba(50,173,230,.2);
  --violet-ink: #b89bff; --violet-tint: rgba(142,92,247,.22);
  --good-ink: #4ade80; --good-tint: rgba(52,199,89,.2); --ok-ink: #5eaeff; --ok-tint: rgba(10,132,255,.22);
  --warn-ink: #ffb84d; --warn-tint: rgba(255,159,10,.2);
  --en-warm: #5ad4ea; --en-warm-t: rgba(64,200,224,.18); --en-peak: #ff9a5c; --en-peak-t: rgba(255,120,50,.2); --bar-glass: rgba(30,30,34,.66);
  --glass: rgba(36,36,40,.55); --glass-hi: rgba(48,48,54,.78); --glass-edge: rgba(255,255,255,.42); --glass-edge-2: rgba(255,255,255,.12);
  --glass-line: rgba(255,255,255,.1); --glass-shadow: 0 16px 40px -12px rgba(0,0,0,.7), 0 2px 8px -2px rgba(0,0,0,.5);
  --lens: linear-gradient(180deg, rgba(255,255,255,.2), rgba(255,255,255,.07));
  --lens-shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 16px -6px rgba(0,0,0,.6);
  --sheet: rgba(20,20,22,.9); --deck: #1c1c1e; --scrim: rgba(0,0,0,.5); --behind: #000000; --bubble: #262629;
  --orb-bg: radial-gradient(circle at 50% 34%, #24242c 0%, #121216 60%, #08080a 100%);
  --orb-shadow: 0 30px 70px -26px rgba(120,80,255,.4), 0 10px 22px -12px rgba(0,0,0,.6);
  --logo-blend: screen;
  --spec: rgba(255,255,255,.16); --lens-spec: rgba(255,255,255,.14);
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: var(--bg); transition: background-color .45s; }
body { margin: 0; background: var(--bg); color: var(--label); font: 400 17px/1.4 var(--font); direction: rtl; text-align: right;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; -webkit-tap-highlight-color: transparent; transition: background-color .45s; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
h1, h2, h3, p, ol, ul { margin: 0; }
bdi { unicode-bidi: isolate; }
.ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }
.num { font-family: var(--round); font-variant-numeric: tabular-nums; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
:focus-visible { outline: 2.5px solid var(--ok); outline-offset: 2px; }
svg.i { width: 20px; height: 20px; flex: none; display: block; }
.logo { width: 22px; height: 14px; flex: none; display: block; overflow: visible; }
.logo .la { fill: var(--vocal); }
.logo .lb { fill: var(--beat); mix-blend-mode: var(--logo-blend); }

/* ---------- glass ---------- */
.glass { background: var(--glass); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
  box-shadow: var(--glass-shadow), inset 0 0 0 .5px var(--glass-line); }
.glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; padding: 1px; z-index: 0;
  background: linear-gradient(170deg, var(--glass-edge) 0%, var(--glass-edge-2) 22%, transparent 48%, transparent 64%, var(--glass-edge-2) 86%, var(--glass-edge) 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }

/* ---------- page ---------- */
#page { position: relative; background: var(--bg); min-height: 100vh; min-height: 100dvh;
  padding: max(68px, calc(env(safe-area-inset-top, 0px) + 20px)) max(var(--gut), env(safe-area-inset-right, 0px)) calc(var(--dock) + 36px) max(var(--gut), env(safe-area-inset-left, 0px));
  transform-origin: 50% 50%; transition: transform .55s var(--sheet-ease), clip-path .55s var(--sheet-ease), opacity .4s; }
.wrap { max-width: 1120px; margin: 0 auto; }
html.behind, html.behind body { background: var(--behind); }
html.behind #page { transform: scale(.94); }

.lt { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 22px; }
.lt-t { flex: 1; min-width: 0; }
.eyebrow { display: flex; align-items: center; gap: 7px; font-size: 13px; line-height: 18px; font-weight: 700; color: var(--accent-ink); margin-bottom: 3px; }
.lt h1 { font-size: 34px; line-height: 41px; font-weight: 800; letter-spacing: -.012em; }
.hbtn { position: relative; flex: none; width: 42px; height: 42px; border-radius: 50%; border: 0; display: grid; place-items: center; color: var(--label); margin-bottom: 0; transition: transform .35s var(--spring); }
.hbtn svg { position: relative; z-index: 1; width: 21px; height: 21px; }
.hbtn:active { transform: scale(.9); }
.hbtn .pip { position: absolute; z-index: 2; top: 1px; inset-inline-start: 1px; width: 11px; height: 11px; border-radius: 50%; background: var(--violet); box-shadow: 0 0 0 2px var(--bg); }

.sec { margin-top: 30px; }
.sec:first-of-type { margin-top: 0; }
.sec-h { font-size: 22px; line-height: 28px; font-weight: 800; letter-spacing: -.008em; margin-bottom: 12px; }
.sec-sub { font-size: 15px; line-height: 20px; color: var(--label-2); margin: -9px 0 12px; }

/* ---------- top mashups rail ---------- */
.rail { display: flex; gap: 12px; overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x mandatory; scroll-padding-inline: var(--gut);
  padding: 2px var(--gut) 36px; margin: 0 calc(-1 * var(--gut)) -24px; scrollbar-width: none; }
.rail::-webkit-scrollbar { display: none; }
.pcard { position: relative; flex: none; width: min(64vw, 262px); aspect-ratio: 4 / 5; border-radius: 22px; border: 0; padding: 15px 16px 16px; overflow: hidden; isolation: isolate;
  scroll-snap-align: start; color: #fff; text-align: right; display: flex; flex-direction: column; justify-content: space-between; background: var(--pc-bg);
  box-shadow: 0 22px 34px -24px var(--pc-sh), 0 0 0 .5px rgba(0,0,0,.04) inset; transition: transform .45s var(--spring), box-shadow .45s; }
.pcard:active { transform: scale(.965); }
.pcard canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -2; display: block; }
.pcard::after { content: ""; position: absolute; inset: 42% 0 0; z-index: -1; background: linear-gradient(to top, rgba(0,0,0,.46), rgba(0,0,0,.18) 55%, rgba(0,0,0,0)); }
.pc-brand { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; letter-spacing: .005em; }
.pc-brand .logo .la, .pc-brand .logo .lb { fill: #fff; mix-blend-mode: normal; }
.pc-brand .logo .lb { fill-opacity: .55; }
.pc-title { display: block; font-size: 30px; line-height: 31px; font-weight: 800; letter-spacing: -.015em; text-wrap: balance; text-shadow: 0 1px 14px rgba(0,0,0,.18); }
.pc-sub { display: block; margin-top: 7px; font-size: 14px; line-height: 18px; font-weight: 600; opacity: .92; }
.pc-on { position: absolute; top: 12px; inset-inline-end: 12px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: #fff;
  background: rgba(255,255,255,.28); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.6); opacity: 0; transform: scale(.4); transition: opacity .3s, transform .45s var(--spring); }
.pc-on svg { width: 16px; height: 16px; }
.pcard[aria-pressed=true] .pc-on { opacity: 1; transform: none; }

/* recent: split mashup covers */
.rtile { flex: none; width: 148px; border: 0; background: none; padding: 0; text-align: right; display: grid; gap: 7px; scroll-snap-align: start; transition: transform .4s var(--spring); }
.rtile:active { transform: scale(.96); }
.rt-art { position: relative; width: 148px; height: 148px; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 22px -14px rgba(0,0,0,.5); }
.rt-art .cv { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 0; font-size: 56px; }
.rt-art .cv.a { clip-path: polygon(0 0, 100% 0, 100% 100%); }
.rt-art .cv.b { clip-path: polygon(0 0, 100% 100%, 0 100%); }
.rt-art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top left, transparent calc(50% - 1px), rgba(255,255,255,.95) calc(50% - 1px), rgba(255,255,255,.95) calc(50% + 1px), transparent calc(50% + 1px)); }
.rt-t { font-size: 14px; line-height: 18px; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.rt-s { font-size: 13px; line-height: 16px; color: var(--label-2); margin-top: -4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- genre picker ---------- */
.picker { position: relative; background: var(--card); border-radius: 24px; padding: 14px 0; }
.prow { display: grid; gap: 9px; min-width: 0; }
.plbl { padding: 0 16px; font-size: 13px; line-height: 18px; font-weight: 700; display: flex; align-items: center; gap: 7px; }
.plbl i { width: 9px; height: 9px; border-radius: 50%; }
.prow.A .plbl { color: var(--vocal-ink); } .prow.A .plbl i { background: var(--vocal); }
.prow.B .plbl { color: var(--beat-ink); } .prow.B .plbl i { background: var(--beat); }
.chips { display: flex; gap: 8px; overflow-x: auto; overscroll-behavior-x: contain; padding: 1px 16px 3px; scrollbar-width: none; scroll-padding-inline: 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 36px; padding: 0 14px 0 13px; border-radius: 18px; border: 0; background: var(--card-hi); color: var(--label); display: inline-flex; align-items: center; gap: 7px;
  font-size: 15px; font-weight: 600; box-shadow: 0 1px 1px rgba(0,0,0,.04), inset 0 0 0 .5px var(--sep); transition: background-color .3s, color .3s, transform .4s var(--spring), box-shadow .3s; white-space: nowrap; }
.chip:active { transform: scale(.94); }
.chip .gd { width: 8px; height: 8px; border-radius: 50%; background: var(--gc); flex: none; transition: box-shadow .3s; }
.prow.A .chip[aria-checked=true] { background: var(--vocal-strong); color: #fff; box-shadow: 0 8px 16px -8px var(--vocal); }
.prow.B .chip[aria-checked=true] { background: var(--beat-strong); color: #fff; box-shadow: 0 8px 16px -8px var(--beat); }
.chip[aria-checked=true] .gd { box-shadow: 0 0 0 2px rgba(255,255,255,.95); }
.chips.subs { gap: 6px; margin-top: -2px; }
.sub { flex: none; height: 30px; padding: 0 11px; border-radius: 15px; border: 0; background: transparent; color: var(--label-2); font-size: 13px; font-weight: 600; white-space: nowrap; box-shadow: inset 0 0 0 1px var(--sep); transition: background-color .25s, color .25s; }
.sub[aria-checked=true] { background: var(--label); color: var(--bg); box-shadow: none; }
.pmid { position: relative; height: 1px; margin: 14px 16px 13px; margin-inline-end: 62px; background: var(--sep); }
.swapb { position: absolute; top: 50%; inset-inline-end: 12px; width: 40px; height: 40px; margin-top: -20px; border-radius: 50%; border: 0; display: grid; place-items: center;
  background: var(--card-hi); color: var(--label); box-shadow: 0 4px 12px -4px rgba(0,0,0,.18), inset 0 0 0 .5px var(--sep); transition: transform .6s var(--spring); }
.swapb svg { width: 19px; height: 19px; }
.swapb.turn { transform: rotate(180deg); }

.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
.seg { position: relative; display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; height: 36px; padding: 2px; border-radius: 18px; background: var(--fill); }
.seg button { position: relative; z-index: 1; border: 0; background: none; padding: 0 13px; border-radius: 16px; font-size: 14px; font-weight: 600; color: var(--label); white-space: nowrap; }
.seg-th { position: absolute; z-index: 0; top: 2px; bottom: 2px; inset-inline-start: 2px; width: calc(50% - 2px); border-radius: 16px; background: var(--card-hi);
  box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.04); transition: transform .5s var(--spring); }
.seg[data-v="1"] .seg-th { transform: translateX(-100%); }
.erow { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
.elbl { font-size: 14px; font-weight: 700; color: var(--label-2); flex: none; }
.seg-e { flex: 1; min-width: 0; max-width: 460px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.seg-e button { padding: 0 6px; }
.seg-e .seg-th { width: calc((100% - 4px) / 4); transform: translateX(calc(var(--i, 0) * -100%)); }
.seg-e[data-e=warm] button[data-e=warm] { color: var(--en-warm); }
.seg-e[data-e=groove] button[data-e=groove] { color: var(--violet-ink); }
.seg-e[data-e=peak] button[data-e=peak] { color: var(--en-peak); }
.tchip, .sortp { position: relative; height: 36px; padding: 0 14px; border-radius: 18px; border: 0; background: var(--fill); color: var(--label); display: inline-flex; align-items: center; gap: 6px;
  font-size: 14px; font-weight: 600; white-space: nowrap; transition: background-color .25s, color .25s, transform .35s var(--spring); }
.tchip:active, .sortp:active { transform: scale(.95); }
.tchip svg { width: 15px; height: 15px; display: none; }
.tchip[aria-pressed=true] { background: var(--label); color: var(--bg); padding-inline-start: 11px; }
.tchip[aria-pressed=true] svg { display: block; }
.sortp { padding-inline: 13px 11px; }
.sortp span { color: var(--label-2); font-weight: 500; }
.sortp svg { width: 14px; height: 14px; color: var(--label-2); }
.sortp select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 16px; -webkit-appearance: none; appearance: none; border: 0; }

.rhead { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; column-gap: 12px; margin: 28px 0 14px; }
.rhead > div { display: contents; }
.rhead h2 { grid-column: 1; grid-row: 1; }
.rhead p { grid-column: 1 / -1; grid-row: 2; }
.rhead .surprise { grid-column: 2; grid-row: 1; align-self: center; }
.rhead h2 { font-size: 28px; line-height: 32px; font-weight: 800; letter-spacing: -.012em; }
.rhead p { margin-top: 3px; font-size: 15px; line-height: 20px; color: var(--label-2); }
.surprise { position: relative; flex: none; height: 40px; padding: 0 16px 0 15px; border-radius: 20px; border: 0; color: #fff; font-size: 15px; font-weight: 700;
  display: inline-flex; align-items: center; gap: 7px; overflow: hidden; isolation: isolate;
  background: linear-gradient(100deg, #f0284f 0%, #8a4cf0 52%, #1789c9 100%); box-shadow: 0 10px 20px -10px rgba(138,76,240,.75), inset 0 1px 0 rgba(255,255,255,.35);
  transition: transform .4s var(--spring); }
.surprise svg { width: 18px; height: 18px; }
.surprise:active { transform: scale(.94); }

/* ---------- cards ---------- */
.cards { display: grid; gap: 12px; }
.card { position: relative; container-type: inline-size; background: var(--card); border-radius: 24px; padding: 14px; display: grid; gap: 12px; isolation: isolate; min-width: 0; }
.card.rise { animation: cardIn .6s var(--out) both; animation-delay: var(--d, 0ms); }
.c-top { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; }
.c-art { display: grid; gap: 6px; justify-items: center; width: 84px; }
.c-art .match, .c-art .en { width: 100%; justify-content: center; }
.stack { position: relative; width: 80px; height: 74px; }
.stack .cv { position: absolute; width: 58px; height: 58px; border-radius: 10px; }
.stack .cv.a { top: 0; right: 0; z-index: 2; box-shadow: 0 8px 16px -8px rgba(0,0,0,.45), 0 0 0 2px var(--card); }
.stack .cv.b { bottom: 0; left: 0; z-index: 1; }
/* the two covers lean into each other while their mashup plays (answers the play tap) */
.stack .cv { transition: transform .7s var(--spring), box-shadow .5s; }
.card.is-playing .stack .cv.a { transform: translate(-6px, 5px) rotate(-5deg); }
.card.is-playing .stack .cv.b { transform: translate(6px, -4px) rotate(4deg); }
.match { display: inline-flex; align-items: baseline; gap: 4px; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 12px; line-height: 22px; font-weight: 700; white-space: nowrap; }
.match b { font-family: var(--round); font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; }
.match.good { background: var(--good-tint); color: var(--good-ink); }
.match.ok { background: var(--ok-tint); color: var(--ok-ink); }
.match.warn { background: var(--warn-tint); color: var(--warn-ink); }
.c-rows { display: grid; gap: 9px; min-width: 0; padding-top: 1px; }
.c-row { min-width: 0; }
.tl { display: flex; align-items: flex-start; gap: 7px; min-width: 0; }
.tag { flex: none; margin-top: 2px; height: 18px; padding: 0 6px; border-radius: 6px; font-size: 11px; line-height: 18px; font-weight: 800; }
.tag.v { color: var(--vocal-ink); background: var(--vocal-tint); }
.tag.b { color: var(--beat-ink); background: var(--beat-tint); }
.tt { min-width: 0; font-size: 16px; line-height: 21px; font-weight: 650; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ar { margin-top: 1px; font-size: 14px; line-height: 19px; color: var(--label-2); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ar .hot { color: var(--warn-ink); font-weight: 600; }
.ar .gn { white-space: nowrap; }
.sg { font-weight: 400; opacity: .82; }
.gn, .nw { white-space: nowrap; }
.sg bdi { font-size: .93em; }
/* energy chip: a word, never a number */
.en { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px 0 9px; border-radius: 11px; font-size: 12px; line-height: 22px; font-weight: 700; white-space: nowrap; }
.en .eb { display: inline-flex; align-items: flex-end; gap: 1.5px; height: 10px; direction: ltr; }
.en .eb i { width: 3px; border-radius: 1px; background: currentColor; opacity: .28; }
.en .eb i:nth-child(1) { height: 4px; } .en .eb i:nth-child(2) { height: 7px; } .en .eb i:nth-child(3) { height: 10px; }
.en.warm .eb i:nth-child(1), .en.groove .eb i:nth-child(-n+2), .en.peak .eb i { opacity: 1; }
.en.warm { color: var(--en-warm); background: var(--en-warm-t); }
.en.groove { color: var(--violet-ink); background: var(--violet-tint); }
.en.peak { color: var(--en-peak); background: var(--en-peak-t); }
.ib { width: 36px; height: 36px; margin: -6px -6px 0 -6px; border-radius: 50%; border: 0; background: none; display: grid; place-items: center; color: var(--label-3); transition: transform .45s var(--spring), color .25s; }
.ib svg { width: 22px; height: 22px; }
.ib:active { transform: scale(.85); }
.star .f { display: none; }
.star[aria-pressed=true] { color: var(--accent); }
.star[aria-pressed=true] .o { display: none; }
.star[aria-pressed=true] .f { display: block; }
.star.pop { animation: pop .5s var(--spring); }
.why { display: flex; gap: 7px; align-items: flex-start; font-size: 14px; line-height: 19px; color: var(--label-2); background: var(--fill-2); border-radius: 12px; padding: 8px 10px; }
.why svg { width: 15px; height: 15px; margin-top: 2px; color: var(--violet); }
.c-acts { display: flex; flex-wrap: wrap; gap: 8px; }
.c-acts .btn { flex: 1 1 40%; }
.c-acts .pri { flex: 1 1 56%; order: 1; }
.c-acts .n { flex: 0 0 auto; order: 2; height: 44px; border-radius: 22px; padding: 0 16px; }
.c-acts .v { order: 3; } .c-acts .b { order: 4; }
@container (max-width: 300px) {
  .c-acts .btn:not(.pri) svg { display: none; }
}
@container (min-width: 560px) {
  .c-acts { flex-wrap: nowrap; }
  .c-acts .pri { flex: 1.5 1 0; order: 1; } .c-acts .v { flex: 1 1 0; order: 2; } .c-acts .b { flex: 1 1 0; order: 3; } .c-acts .n { flex: 1 1 0; order: 4; height: 44px; }
  .c-acts .v, .c-acts .b { height: 44px; border-radius: 22px; }
}
.btn { position: relative; height: 38px; padding: 0 10px; border-radius: 19px; border: 0; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font-size: 14px; font-weight: 650; white-space: nowrap; min-width: 0; overflow: hidden; transition: transform .35s var(--spring), background-color .25s, color .25s, box-shadow .3s; }
.btn:active { transform: scale(.95); }
.btn svg { width: 16px; height: 16px; }
.btn > span { overflow: hidden; text-overflow: ellipsis; }
.btn.pri { height: 44px; border-radius: 22px; font-size: 16px; font-weight: 700; background: var(--card-hi); color: var(--accent-ink); box-shadow: 0 1px 2px rgba(0,0,0,.05), inset 0 0 0 .5px var(--sep); }
.btn.pri svg { width: 17px; height: 17px; }
.btn.v { background: var(--vocal-tint); color: var(--vocal-ink); }
.btn.b { background: var(--beat-tint); color: var(--beat-ink); }
.btn.n { background: var(--fill); color: var(--label); }
.btn[aria-pressed=true].pri { background: var(--accent); color: #fff; box-shadow: 0 10px 22px -12px var(--accent); }
.btn[aria-pressed=true].v { background: var(--vocal-strong); color: #fff; }
.btn[aria-pressed=true].b { background: var(--beat-strong); color: #fff; }
.bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 13px; }
.bars i { width: 3px; height: 4px; border-radius: 1.5px; background: currentColor; animation: bar .9s ease-in-out infinite; }
.bars i:nth-child(2) { animation-delay: -.45s; } .bars i:nth-child(3) { animation-delay: -.2s; } .bars i:nth-child(4) { animation-delay: -.65s; }
.card.is-loaded::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; z-index: -1; pointer-events: none;
  background: linear-gradient(120deg, var(--vocal), var(--violet) 50%, var(--beat));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
.card.is-loaded { box-shadow: -14px 14px 34px -22px var(--vocal), 14px -10px 34px -22px var(--beat); }
.card.is-playing { animation: glow 2.8s ease-in-out infinite; }
.more { display: flex; width: 100%; height: 46px; margin-top: 12px; border-radius: 23px; border: 0; background: var(--fill); color: var(--accent-ink); font-size: 16px; font-weight: 650; align-items: center; justify-content: center; gap: 6px; transition: transform .35s var(--spring); }
.more:active { transform: scale(.97); }
.empty { text-align: center; padding: 40px 18px; display: grid; justify-items: center; gap: 8px; background: var(--card); border-radius: 24px; }
.empty .em-ic { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: var(--fill); color: var(--label-2); margin-bottom: 4px; }
.empty .em-ic svg { width: 26px; height: 26px; }
.empty h3 { font-size: 19px; line-height: 24px; font-weight: 750; }
.empty p { font-size: 15px; line-height: 21px; color: var(--label-2); max-width: 32ch; }
.empty .btn { margin-top: 8px; height: 40px; padding: 0 18px; border-radius: 20px; background: var(--accent); color: #fff; font-size: 15px; }

/* ---------- covers ---------- */
.cv { position: relative; display: block; overflow: hidden; border-radius: 8px; background: #888; color: #fff; isolation: isolate; font-size: 26px; }
.cv b { position: absolute; inset-inline-end: 9%; bottom: 3%; font-size: .98em; line-height: 1; font-weight: 800; letter-spacing: -.02em; opacity: .94; text-shadow: 0 2px 10px rgba(0,0,0,.18); }
.cv img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; z-index: 1; }
.cv::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.1); z-index: 2; pointer-events: none; }

/* ---------- search ---------- */
.sfield { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 54px); z-index: 6; display: flex; align-items: center; gap: 8px; height: 48px; border-radius: 24px; padding: 0 15px; margin-bottom: 18px; }
.sfield > * { position: relative; z-index: 1; }
.sfield svg { width: 20px; height: 20px; color: var(--label-2); }
.sfield input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; outline: none; font-size: 17px; color: var(--label); }
.sfield input::placeholder { color: var(--label-2); }
.sfield input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
.sclear { width: 28px; height: 28px; border-radius: 50%; border: 0; background: var(--fill-3); color: var(--label); display: grid; place-items: center; }
.sclear svg { width: 14px; height: 14px; color: inherit; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { position: relative; aspect-ratio: 16 / 11; border-radius: 18px; border: 0; padding: 12px 14px; color: #fff; font-size: 19px; line-height: 22px; font-weight: 800; text-align: right;
  display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; isolation: isolate; background: var(--tile-bg); transition: transform .4s var(--spring); }
.tile:active { transform: scale(.96); }
.tile small { font-size: 13px; font-weight: 600; opacity: .85; }
.tile .cv b { display: none; }
.tile .cv { position: absolute; top: 10px; inset-inline-end: -14px; width: 66px; height: 66px; border-radius: 10px; transform: rotate(-14deg); z-index: -1; box-shadow: 0 10px 18px -8px rgba(0,0,0,.4); font-size: 30px; }
.sgchip { display: inline-flex; align-items: center; gap: 4px; height: 30px; padding: 0 10px 0 8px; border-radius: 15px; border: 0; background: var(--label); color: var(--bg); font-size: 14px; font-weight: 650; flex: none; }
.sgchip svg { width: 13px; height: 13px; }
.slist { display: grid; }
.srow { width: 100%; display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 7px 0; border: 0; background: none; text-align: right; color: var(--label); }
.srow .cv { width: 52px; height: 52px; border-radius: 8px; font-size: 24px; }
.srow .s-txt { min-width: 0; display: grid; align-self: stretch; align-content: center; border-bottom: .5px solid var(--sep); padding-bottom: 7px; margin-bottom: -7px; }
.srow .s-t { font-size: 16px; line-height: 21px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srow .s-a { font-size: 14px; line-height: 19px; color: var(--label-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srow > svg { width: 16px; height: 16px; color: var(--label-3); }
.srow:active { opacity: .6; }
.scount { font-size: 13px; color: var(--label-2); margin: 0 0 4px; }
.backb { display: inline-flex; align-items: center; gap: 2px; height: 34px; padding: 0 10px 0 6px; margin: -4px -6px 8px; border-radius: 17px; border: 0; background: none; color: var(--accent-ink); font-size: 17px; font-weight: 500; }
.backb svg { width: 20px; height: 20px; }
.phead { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 14px; align-items: center; margin-bottom: 16px; }
.phead .cv { width: 104px; height: 104px; border-radius: 14px; font-size: 46px; box-shadow: 0 16px 28px -16px rgba(0,0,0,.5); }
.phead h2 { font-size: 22px; line-height: 27px; font-weight: 800; overflow-wrap: anywhere; }
.phead p { font-size: 15px; line-height: 20px; color: var(--label-2); margin-top: 3px; }
.rolebar { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.rolebar .seg { height: 38px; }
.rolebar .seg button { padding: 0 14px; }

/* ---------- DJ chat ---------- */
.chat { display: flex; flex-direction: column; gap: 6px; padding-bottom: 12px; }
.bub { max-width: 84%; padding: 9px 14px 10px; border-radius: 20px; font-size: 17px; line-height: 23px; overflow-wrap: anywhere; animation: bubIn .45s var(--spring) both; }
.bub.me { align-self: flex-end; background: var(--ok); color: #fff; border-end-end-radius: 7px; margin-top: 6px; }
.bub.dj { align-self: flex-start; background: var(--bubble); color: var(--label); border-end-start-radius: 7px; }
.bub.dj b { font-weight: 700; }
.bub .tools { display: block; margin-top: 4px; font-size: 12px; color: var(--label-2); }
.bub .note { display: block; margin-top: 6px; font-size: 14px; color: var(--warn-ink); }
.think { display: inline-flex; gap: 5px; padding: 6px 2px; }
.think i { width: 8px; height: 8px; border-radius: 50%; background: var(--label-3); animation: dot 1.2s ease-in-out infinite; }
.think i:nth-child(2) { animation-delay: .15s; } .think i:nth-child(3) { animation-delay: .3s; }
.dj-cards { display: grid; gap: 10px; margin: 6px 0 4px; }
.goto { justify-self: start; height: 36px; padding: 0 14px; border-radius: 18px; border: 0; background: var(--accent-tint); color: var(--accent-ink); font-size: 15px; font-weight: 650; }
.askdock { position: sticky; bottom: calc(var(--dock) + 12px); z-index: 5; display: grid; gap: 8px; margin-top: 8px; }
.sugg { display: flex; gap: 8px; overflow-x: auto; padding: 2px var(--gut) 2px; margin: 0 calc(-1 * var(--gut)); scrollbar-width: none; }
.sugg::-webkit-scrollbar { display: none; }
.sugg button { flex: none; height: 36px; padding: 0 14px; border-radius: 18px; border: 0; background: color-mix(in srgb, var(--card-hi) 92%, transparent); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
  box-shadow: 0 4px 14px -8px rgba(0,0,0,.25), inset 0 0 0 .5px var(--glass-line); color: var(--label); font-size: 14px; font-weight: 600; transition: transform .35s var(--spring); }
.sugg button:active { transform: scale(.95); }
.composer { position: relative; display: flex; align-items: flex-end; gap: 6px; padding: 5px; border-radius: 26px; background: var(--bar-glass); }
.composer > * { position: relative; z-index: 1; }
.composer textarea { flex: 1; min-width: 0; resize: none; border: 0; background: none; outline: none; font-size: 17px; line-height: 22px; padding: 9px 12px; max-height: 132px; color: var(--label); }
.composer textarea::placeholder { color: var(--label-2); }
.sendb { width: 38px; height: 38px; border-radius: 50%; border: 0; display: grid; place-items: center; background: var(--ok); color: #fff; flex: none; transition: transform .35s var(--spring), opacity .2s; }
.sendb svg { width: 19px; height: 19px; }
.sendb[disabled] { opacity: .35; }
.sendb.stop { background: var(--label); color: var(--bg); }
.newchat { height: 32px; padding: 0 12px; border-radius: 16px; border: 0; background: var(--fill); color: var(--label); font-size: 14px; font-weight: 600; margin-bottom: 6px; }

/* ---------- mini-player ---------- */
.mini-glow { position: fixed; z-index: 29; left: 50%; bottom: calc(var(--tab-b) + var(--tab-h) - 18px); width: min(calc(100% + 24px), 640px); height: 112px; transform: translateX(-50%);
  pointer-events: none; opacity: 0; transition: opacity .9s; filter: blur(14px); }
.mini-glow.on { opacity: .9; }
.mini { position: fixed; z-index: 30; left: 50%; bottom: calc(var(--tab-b) + var(--tab-h) + 10px); width: min(calc(100% - 2 * var(--gut)), 560px); height: 60px; border-radius: 30px;
  display: flex; align-items: center; gap: 2px; padding: 0 6px 0 8px; transform: translateX(-50%); transition: transform .65s var(--spring), opacity .35s; }
.mini > * { position: relative; z-index: 1; }
.mini.off { transform: translateX(-50%) translateY(150%) scale(.9); opacity: 0; pointer-events: none; }
.mini-main { flex: 1; min-width: 0; height: 100%; display: flex; align-items: center; gap: 11px; padding: 0 2px 0 0; border: 0; background: none; color: var(--label); text-align: right; border-radius: 26px; }
.mini-cov { position: relative; width: 54px; height: 44px; flex: none; }
.mini-cov .cv { position: absolute; width: 40px; height: 40px; border-radius: 9px; font-size: 18px; }
.mini-cov .cv.a { top: 0; right: 0; z-index: 2; box-shadow: 0 4px 10px -4px rgba(0,0,0,.4); }
.mini-cov .cv.b { bottom: 0; left: 0; }
.mini-txt { min-width: 0; display: grid; }
.mini-t { display: flex; align-items: baseline; gap: 5px; min-width: 0; font-size: 15px; line-height: 20px; font-weight: 650; white-space: nowrap; }
.mini-t bdi { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.mini-t .m1, .mini-t .m2 { flex: 0 1 auto; max-width: 64%; }
.mini-t .x { flex: none; color: var(--label-3); font-weight: 500; font-size: 13px; }
.mini-s { font-size: 13px; line-height: 17px; color: var(--label-2); display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; }
.mini-s .bars { height: 10px; color: var(--accent); }
.mini-s .bars i { width: 2.5px; }
.mini-b { width: 44px; height: 44px; flex: none; border-radius: 50%; border: 0; background: none; color: var(--label); display: grid; place-items: center; transition: transform .35s var(--spring), background-color .2s; }
.mini-b:active { transform: scale(.86); background: var(--fill); }
.mini-b svg { width: 24px; height: 24px; }
.mini-b.x svg { width: 19px; height: 19px; }
.mini-prog { position: absolute; left: 26px; right: 26px; bottom: 4px; height: 2.5px; border-radius: 2px; background: var(--fill); overflow: hidden; direction: ltr; z-index: 1; }
.mini-prog i { display: block; width: 100%; height: 100%; transform-origin: 0 50%; transform: scaleX(0); background: linear-gradient(90deg, var(--vocal), var(--violet), var(--beat)); }

/* ---------- tab bar with liquid lens ---------- */
.tabbar.glass, .mini.glass { background: var(--bar-glass); -webkit-backdrop-filter: blur(28px) saturate(190%); backdrop-filter: blur(28px) saturate(190%); }
.edge-b { position: fixed; z-index: 28; left: 0; right: 0; bottom: 0; height: calc(var(--dock) + 26px); pointer-events: none;
  background: linear-gradient(to top, color-mix(in srgb, var(--bg) 78%, transparent) 0%, color-mix(in srgb, var(--bg) 40%, transparent) 55%, transparent);
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); -webkit-mask: linear-gradient(to top, #000 50%, transparent); mask: linear-gradient(to top, #000 50%, transparent); transition: height .5s var(--spring); }
html.behind .edge-b { opacity: 0; }
/* compact glass title bar: fades in once the large title scrolls away (iOS navigation bar behaviour) */
.topbar { position: fixed; z-index: 27; top: 0; left: 0; right: 0; height: calc(env(safe-area-inset-top, 0px) + 46px); padding-top: env(safe-area-inset-top, 0px); display: grid; place-items: center;
  font-size: 17px; line-height: 22px; font-weight: 700; color: var(--label); pointer-events: none;
  background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); box-shadow: 0 .5px 0 var(--sep);
  opacity: 0; transition: opacity .28s; }
.topbar span { opacity: 0; transform: translateY(7px); transition: opacity .3s, transform .45s var(--spring); }
.topbar.on { opacity: 1; }
.topbar.on span { opacity: 1; transform: none; }
html.behind .topbar { opacity: 0; }
.edge-t { position: fixed; z-index: 28; left: 0; right: 0; top: 0; height: calc(env(safe-area-inset-top, 0px) + 10px); pointer-events: none; background: linear-gradient(var(--bg) 40%, transparent); }
.tabbar { position: fixed; z-index: 31; left: 50%; bottom: var(--tab-b); height: var(--tab-h); width: min(calc(100% - 2 * var(--gut)), calc(var(--tabs, 3) * 98px + 8px)); border-radius: 32px;
  display: flex; padding: 4px; transform: translateX(-50%); touch-action: pan-y; transition: transform .5s var(--spring); }
.lens { position: absolute; z-index: 1; top: 4px; bottom: 4px; left: 0; width: var(--w, 90px); border-radius: 28px; transform: translateX(var(--x, 4px));
  background: var(--lens); box-shadow: var(--lens-shadow), inset 0 1px 0 rgba(255,255,255,.75), inset 0 -1px 1px rgba(0,0,0,.05);
  transition: transform .62s var(--spring), width .62s var(--spring), scale .35s var(--spring); pointer-events: none; }
.lens::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.4px; opacity: .8;
  background: conic-gradient(from 200deg, rgba(255,64,129,.65), rgba(255,196,0,.5), rgba(64,255,168,.5), rgba(0,176,255,.65), rgba(176,64,255,.55), rgba(255,64,129,.65));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  filter: blur(.4px); }
.lens::after { content: ""; position: absolute; inset: 1px; border-radius: inherit; background: linear-gradient(180deg, var(--lens-spec), rgba(255,255,255,0) 55%); opacity: .9; pointer-events: none; }
.lens.squish { animation: squish .62s var(--out); }
.lens.drag { scale: 1.1 1.06; transition: width .2s, scale .35s var(--spring); }
.tab { position: relative; z-index: 2; flex: 1; min-width: 0; height: 100%; border: 0; background: none; border-radius: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--label); font-size: 10.5px; line-height: 12px; font-weight: 600; transition: color .3s; }

/* ---------- island toast ---------- */

.island svg { width: 18px; height: 18px; flex: none; }
.island .ic-v { color: var(--vocal); } .island .ic-a { color: var(--accent); } .island .ic-o { color: #5eaeff; }

/* ---------- sheets ---------- */

.scrim.on { opacity: 1; }
.sheet { position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 1180px; border-radius: 32px 32px 0 0; background: var(--sheet);
  -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%); box-shadow: 0 -12px 40px -14px rgba(0,0,0,.35), inset 0 .5px 0 var(--glass-edge);
  transform: translateY(104%); transition: transform .56s var(--sheet-ease); overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; outline: none; }

.sheet.mid { max-height: 88vh; max-height: 88dvh; max-width: 620px; }
.grab { width: 38px; height: 5px; border-radius: 3px; background: var(--fill-3); margin: 6px auto 0; }

  background: linear-gradient(var(--sheet) 72%, transparent); -webkit-backdrop-filter: none; }

.rbtn { position: relative; width: 38px; height: 38px; flex: none; border-radius: 50%; border: 0; background: var(--fill); color: var(--label); display: grid; place-items: center; transition: transform .35s var(--spring); }

.rbtn svg { width: 20px; height: 20px; }
.rbtn.star[aria-pressed=true] { color: var(--accent); }

/* ---------- mixer ---------- */
.mx-body { padding: 4px max(16px, env(safe-area-inset-right, 0px)) calc(30px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.mx-grid { display: grid; gap: 14px; direction: ltr; }
.deck { position: relative; direction: rtl; background: var(--deck); border-radius: 26px; padding: 16px 16px 14px; display: grid; gap: 12px; overflow: hidden; isolation: isolate; min-width: 0;
  box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 10px 30px -18px rgba(0,0,0,.25); }

.deck::before { content: ""; position: absolute; inset: 0 0 auto; height: 110px; z-index: -1; background: linear-gradient(to bottom, var(--rc-t), transparent); }
.deck::after { content: ""; position: absolute; inset: 0 0 auto; height: 3px; background: var(--rc); }
.dk-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; }

.dk-art .cv { width: 84px; height: 84px; border-radius: 14px; font-size: 38px; box-shadow: 0 6px 14px -8px rgba(0,0,0,.45); transition: box-shadow .6s; }
.deck.playing .dk-art { transform: none; }

.dk-info { min-width: 0; display: grid; gap: 1px; }
.dk-title { font-size: 18px; line-height: 23px; font-weight: 750; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.dk-artist { font-size: 14px; line-height: 19px; color: var(--label-2); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.srcb { justify-self: start; margin-top: -2px; display: inline-flex; align-items: center; gap: 6px; max-width: 100%; min-height: 26px; padding: 4px 10px; border-radius: 13px; font-size: 12.5px; line-height: 17px; font-weight: 650;
  background: var(--fill-2); color: var(--label-2); }
.srcb svg { width: 13px; height: 13px; }
.srcb.apple { background: var(--accent-tint); color: var(--accent-ink); }
.srcb.studio { background: var(--violet-tint); color: var(--violet-ink); }
.srcb .spin { width: 11px; height: 11px; flex: none; border-radius: 50%; border: 2px solid currentColor; border-top-color: transparent; animation: spin .8s linear infinite; }
.dk-pp { width: 58px; height: 58px; border-radius: 50%; border: 0; display: grid; place-items: center; background: var(--rc-s); color: #fff; box-shadow: 0 10px 22px -10px var(--rc); transition: transform .4s var(--spring); }

.times { display: flex; justify-content: space-between; margin-top: -2px; direction: ltr; font: 600 12px/16px var(--round); font-variant-numeric: tabular-nums; color: var(--label-2); }

.dk-vol svg { width: 18px; height: 18px; }
.eq { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; direction: ltr; padding: 10px 10px 6px; border-radius: 16px; background: var(--fill-2); transition: opacity .3s; }
.eqb { display: grid; justify-items: center; gap: 0; min-width: 0; }
.eqb .lb { font-size: 11px; line-height: 14px; font-weight: 800; letter-spacing: .05em; color: var(--label-2); }
.eqb output { font: 650 12px/15px var(--round); font-variant-numeric: tabular-nums; color: var(--label); }
.eq.off { opacity: .42; }
.eq-note { font-size: 12px; line-height: 16px; color: var(--label-2); margin-top: -6px; }
.syncrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.syncb { height: 34px; padding: 0 14px; border-radius: 17px; border: 0; background: var(--fill); color: var(--label); font: 800 13px/1 var(--round); letter-spacing: .06em; display: inline-flex; align-items: center; gap: 6px; transition: background-color .25s, color .25s, transform .35s var(--spring); }
.syncb:active { transform: scale(.94); }
.syncb[aria-pressed=true] { background: var(--rc-s); color: #fff; }
.syncb i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .5; }
.syncb[aria-pressed=true] i { opacity: 1; box-shadow: 0 0 8px #fff; }
.lcd { direction: ltr; unicode-bidi: isolate; font: 650 14px/20px var(--round); font-variant-numeric: tabular-nums; color: var(--label); background: var(--fill-2); border-radius: 10px; padding: 6px 10px; white-space: nowrap; }
.lcd b { color: var(--rc-i); font-weight: 800; }
.lcd .le { color: var(--label-2); font-weight: 700; }

.mx-center { direction: rtl; display: grid; justify-items: center; align-content: start; gap: 14px; padding: 8px 0 6px; min-width: 0; }
.orb { position: relative; width: min(62vw, 236px); aspect-ratio: 1; border-radius: 50%; background: var(--orb-bg); box-shadow: var(--orb-shadow), inset 0 -16px 36px rgba(0,0,0,.07); isolation: isolate; }
.orb canvas { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%; display: block; }
.orb::before { content: ""; position: absolute; inset: 0; border-radius: 50%; z-index: 2; pointer-events: none; padding: 2px;
  background: conic-gradient(from 210deg, rgba(255,255,255,.95), rgba(255,120,170,.45), rgba(255,255,255,.2), rgba(90,200,255,.45), rgba(255,255,255,.9), rgba(180,140,255,.4), rgba(255,255,255,.95));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
.orb::after { content: ""; position: absolute; z-index: 3; pointer-events: none; left: 19%; right: 30%; top: 6%; height: 26%; border-radius: 50%;
  background: radial-gradient(ellipse at 50% 30%, var(--spec), rgba(255,255,255,0) 70%); transform: rotate(-18deg); }
.orb-halo { position: absolute; inset: -14%; z-index: -1; border-radius: 50%; pointer-events: none; opacity: var(--halo, .35); transition: opacity .6s;
  background: radial-gradient(closest-side at var(--hx, 50%) 55%, color-mix(in srgb, var(--violet) 55%, transparent), transparent); filter: blur(18px); }
.orb-cap { font-size: 12px; line-height: 16px; color: var(--label-2); margin-top: -4px; }
.xf { width: 100%; max-width: 330px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; direction: ltr; }
.xf .ab { font: 800 15px/1 var(--round); width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: #fff; }
.xf .ab.a { background: var(--vocal-strong); } .xf .ab.b { background: var(--beat-strong); }
.lnk { border: 0; background: none; color: var(--accent-ink); font-size: 15px; font-weight: 600; height: 32px; padding: 0 12px; border-radius: 16px; margin-top: -6px; }
.lnk:active { background: var(--fill); }
.transport { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 420px; }
.tp { height: 38px; padding: 0 14px 0 13px; border-radius: 19px; border: 0; background: var(--deck); color: var(--label); display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 650; white-space: nowrap;
  box-shadow: 0 1px 2px rgba(0,0,0,.06), inset 0 0 0 .5px var(--sep); transition: transform .35s var(--spring), background-color .25s, color .25s; }
.tp:active { transform: scale(.94); }
.tp svg { width: 16px; height: 16px; }
.tp.pri { background: var(--accent); color: #fff; box-shadow: 0 10px 20px -12px var(--accent); }
.tp[aria-pressed=true] { background: var(--label); color: var(--bg); box-shadow: none; }
.tp.pri[aria-pressed=true] { background: var(--accent); color: #fff; }
.mx-meta { font-size: 14px; line-height: 20px; color: var(--label-2); text-align: center; max-width: 34ch; }
.mx-hint { margin: 8px 2px 0; font-size: 12.5px; line-height: 1.45; color: var(--label-2); text-align: center; }
.mx-beat { margin: 10px auto 0; padding: 6px 12px; border-radius: 14px; font-size: 13px; font-weight: 650; text-align: center; color: var(--label-2); background: var(--fill, rgba(120,120,128,.12)); max-width: 36ch; transition: color .3s, background .3s; }
.mx-beat.on { color: #1c7c3a; background: rgba(52,199,89,.16); }
@media (prefers-color-scheme: dark) { :root:not([data-theme=light]) .mx-beat.on { color: #5fe08a; } }
:root[data-theme=dark] .mx-beat.on { color: #5fe08a; }
.mx-meta b { color: var(--label); font-weight: 650; }
.plan { margin-top: 16px; background: var(--deck); border-radius: 26px; padding: 18px 16px 16px; box-shadow: 0 1px 2px rgba(0,0,0,.04); display: grid; gap: 16px; }
.plan-h { display: grid; gap: 4px; }
.plan h3 { font-size: 20px; line-height: 25px; font-weight: 800; }
.plan-tag { display: flex; align-items: center; gap: 6px; font-size: 13px; line-height: 18px; font-weight: 600; color: var(--violet-ink); }
.plan-tag svg { width: 14px; height: 14px; }
/* arrangement map: B's sections on a time axis, A's two vocal entries on top (time runs left → right like DJ software) */
.arr { position: relative; display: grid; gap: 7px; padding: 12px 12px 28px; border-radius: 18px; background: var(--fill-2); direction: ltr; }
.ln { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 8px; align-items: center; }
.ln > b { font: 800 12px/1 var(--round); text-align: center; }
.ln.lb > b { color: var(--beat-ink); } .ln.la > b { color: var(--vocal-ink); }
.track { position: relative; height: 26px; border-radius: 8px; overflow: hidden; background: var(--fill); }
.ln.la .track { background: transparent; box-shadow: inset 0 0 0 1px var(--sep); }
.blk { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; padding: 0 4px; overflow: hidden; white-space: nowrap; font-size: 10.5px; line-height: 1; font-weight: 750;
  color: var(--beat-ink); background: color-mix(in srgb, var(--beat) 16%, transparent); box-shadow: inset -1px 0 0 var(--deck); }
.blk span { overflow: hidden; text-overflow: clip; direction: rtl; }
.blk.groove, .blk.verse, .blk.hook { background: color-mix(in srgb, var(--beat) 30%, transparent); }
.blk.breakdown, .blk.bridge { background: color-mix(in srgb, var(--beat) 9%, transparent); }
.blk.drop, .blk.chorus, .blk.logdrum { background: var(--beat-strong); color: #fff; }
.seg-a { position: absolute; top: 0; bottom: 0; min-width: 34px; display: flex; align-items: center; justify-content: center; overflow: hidden; white-space: nowrap; border-radius: 8px; font-size: 10.5px; font-weight: 750; color: #fff;
  background: linear-gradient(90deg, var(--vocal-strong), var(--vocal)); box-shadow: 0 6px 12px -6px var(--vocal); }
.seg-a span { direction: rtl; padding: 0 4px; }
.marks { position: absolute; left: 34px; right: 12px; top: 8px; bottom: 6px; pointer-events: none; }
.mk { position: absolute; top: 0; bottom: 0; width: 0; }
.mk i { position: absolute; top: 0; bottom: 17px; left: -.75px; width: 1.5px; border-radius: 1px; background: var(--label); opacity: .55; }
.mk span { position: absolute; bottom: 0; left: 0; transform: translateX(-50%); font: 700 11px/14px var(--round); font-variant-numeric: tabular-nums; color: var(--label-2); white-space: nowrap; }
.steps { list-style: none; padding: 0; margin: 0; counter-reset: s; display: grid; gap: 13px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 26px minmax(0, 1fr); column-gap: 11px; row-gap: 6px; align-items: start; }
.steps li::before { content: counter(s); grid-row: span 2; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 800 13px/1 var(--round); color: #fff;
  background: linear-gradient(135deg, var(--vocal-strong), var(--violet) 60%, var(--beat-strong)); }
.steps p { font-size: 15px; line-height: 21px; }
.cues { display: flex; flex-wrap: wrap; gap: 6px; }
.cue { display: inline-flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 12px; font: 750 13px/1 var(--round); font-variant-numeric: tabular-nums; }
.cue.ca { background: var(--vocal-tint); color: var(--vocal-ink); } .cue.cb { background: var(--beat-tint); color: var(--beat-ink); }
.plan-prep { font-size: 14px; line-height: 20px; color: var(--label-2); }
.plan-prep b { color: var(--label); font-weight: 700; }
.plan-note { display: flex; gap: 7px; align-items: flex-start; font-size: 13px; line-height: 18px; color: var(--label-2); border-top: .5px solid var(--sep); padding-top: 12px; }
.plan-note svg { width: 14px; height: 14px; margin-top: 2px; color: var(--accent); flex: none; }

/* ---------- audio source sheet ---------- */
.src-body { padding: 2px 20px calc(26px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 18px; }
.src-row { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 13px; align-items: start; }
.sq { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: #fff; }
.sq svg { width: 22px; height: 22px; }
.sq.ap { background: linear-gradient(160deg, #ff5a72, #fa2d48); } .sq.st { background: linear-gradient(160deg, #a77bff, #6f3fe0); } .sq.sf { background: linear-gradient(160deg, #3fb2ff, #0a6cff); }
.src-row h3 { font-size: 17px; line-height: 22px; font-weight: 700; }
.src-row p { font-size: 15px; line-height: 21px; color: var(--label-2); margin-top: 2px; }
.now { background: var(--card-hi); border-radius: 18px; padding: 12px 14px; display: grid; gap: 6px; font-size: 15px; line-height: 20px; box-shadow: inset 0 0 0 .5px var(--sep); }
.now .nr { display: flex; justify-content: space-between; gap: 10px; }
.now .nr span:first-child { color: var(--label-2); }
.urlf { width: 100%; height: 46px; margin-top: 10px; border-radius: 13px; border: 0; background: var(--fill); padding: 0 14px; font-size: 16px; direction: ltr; text-align: left; color: var(--label); outline: none; }
.urlf:focus { box-shadow: 0 0 0 2px var(--ok); }
.safari { margin-top: 10px; height: 50px; border-radius: 25px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-size: 17px; font-weight: 700; color: #fff; background: var(--ok); transition: opacity .25s, transform .35s var(--spring); }
.safari svg { width: 21px; height: 21px; }
.safari:active { transform: scale(.97); }
.safari[aria-disabled=true] { opacity: .38; pointer-events: none; }
.info { border-top: .5px solid var(--sep); padding-top: 16px; display: grid; gap: 10px; }
.info h3 { font-size: 17px; line-height: 22px; font-weight: 750; }
.info p { font-size: 15px; line-height: 21px; color: var(--label-2); }
.info p b { color: var(--label); font-weight: 650; }
.srcs-list { font-size: 13px; line-height: 19px; color: var(--label-2); }

/* ---------- views ---------- */
.view.enter { animation: viewIn .5s var(--out) both; }

/* ---------- motion ---------- */
@keyframes viewIn { from { opacity: 0; filter: blur(12px); transform: translateY(14px); } to { opacity: 1; filter: blur(0); transform: none; } }
@keyframes cardIn { from { opacity: 0; filter: blur(8px); transform: translateY(18px) scale(.985); } to { opacity: 1; filter: blur(0); transform: none; } }
@keyframes squish { 0% { scale: 1 1; } 28% { scale: 1.16 .86; } 62% { scale: .97 1.04; } 100% { scale: 1 1; } }
@keyframes bar { 0%, 100% { height: 3px; } 50% { height: 13px; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }
@keyframes dot { 0%, 100% { opacity: .35; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-3px); } }
@keyframes bubIn { from { opacity: 0; transform: translateY(10px) scale(.92); } to { opacity: 1; transform: none; } }
@keyframes glow { 0%, 100% { box-shadow: -14px 14px 34px -22px var(--vocal), 14px -10px 34px -22px var(--beat); } 50% { box-shadow: -18px 18px 42px -18px var(--vocal), 18px -14px 42px -18px var(--beat); } }

/* ---------- larger screens ---------- */
@media (min-width: 700px) {
  :root { --gut: 24px; }
  .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .pcard { width: 268px; }
}
@media (min-width: 900px) {
  .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .mx-grid { grid-template-columns: minmax(0, 1fr) 300px minmax(0, 1fr); align-items: start; }
  .orb { width: 248px; }
  .steps { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; }
  .steps li { grid-template-columns: minmax(0, 1fr); }
  .steps li::before { grid-row: auto; }
  .plan { grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); column-gap: 22px; }
  .plan-h, .steps, .plan-prep, .plan-note { grid-column: 1 / -1; }
  .arr { grid-column: 1 / -1; }
  .sheet.full { top: 24px; left: 24px; right: 24px; border-radius: 32px 32px 0 0; }
  .home-tools { display: grid; grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
}

/* ---------- range inputs ---------- */
.rng { -webkit-appearance: none; appearance: none; width: 100%; height: 26px; margin: 0; background: transparent; direction: ltr; cursor: pointer; --p: 50%; --fc: var(--label); }
.rng:focus { outline: none; }
.rng:focus-visible { outline: 2px solid var(--ok); outline-offset: 2px; border-radius: 8px; }
.rng::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(to right, var(--fc) 0 var(--p), var(--fill-3) var(--p) 100%); }
.rng::-moz-range-track { height: 6px; border-radius: 3px; background: linear-gradient(to right, var(--fc) 0 var(--p), var(--fill-3) var(--p) 100%); }
.rng::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 22px; height: 22px; margin-top: -8px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 2px 7px rgba(0,0,0,.28), 0 0 0 .5px rgba(0,0,0,.08); transition: transform .3s var(--spring); }
.rng::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 2px 7px rgba(0,0,0,.28), 0 0 0 .5px rgba(0,0,0,.08); }
.rng:active::-webkit-slider-thumb { transform: scale(1.12); }
.rng.scrub { --fc: var(--rc); }
.rng.scrub::-webkit-slider-runnable-track { height: 5px; }
.rng.scrub::-webkit-slider-thumb { width: 14px; height: 14px; margin-top: -4.5px; background: var(--rc-s); box-shadow: 0 0 0 3px #fff, 0 2px 6px rgba(0,0,0,.3); }
.rng.scrub::-moz-range-thumb { width: 14px; height: 14px; background: var(--rc-s); box-shadow: 0 0 0 3px #fff, 0 2px 6px rgba(0,0,0,.3); }
.eqb .rng { --fc: var(--rc); }
.eqb .rng::-webkit-slider-thumb { width: 18px; height: 18px; margin-top: -6px; }
.eqb .rng::-moz-range-thumb { width: 18px; height: 18px; }
.xfr { height: 34px; }
.xfr::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--vocal), var(--violet) 50%, var(--beat)); }
.xfr::-moz-range-track { height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--vocal), var(--violet) 50%, var(--beat)); }
.xfr::-webkit-slider-thumb { width: 38px; height: 26px; margin-top: -9px; border-radius: 8px;
  background: linear-gradient(90deg, transparent 47%, rgba(0,0,0,.42) 47% 53%, transparent 53%), linear-gradient(180deg, #ffffff, #e2e2e9); box-shadow: 0 4px 10px rgba(0,0,0,.3), inset 0 0 0 .5px rgba(0,0,0,.12); }
.xfr::-moz-range-thumb { width: 38px; height: 26px; border-radius: 8px;
  background: linear-gradient(90deg, transparent 47%, rgba(0,0,0,.42) 47% 53%, transparent 53%), linear-gradient(180deg, #ffffff, #e2e2e9); box-shadow: 0 4px 10px rgba(0,0,0,.3); }
.rng:disabled { cursor: default; }
html.behind .tabbar, html.behind .mini { opacity: 0 !important; visibility: hidden; pointer-events: none; transition: opacity .25s ease, visibility 0s linear .25s; }
</style>

  var REL = { same: "אותו סולם", adj: "סולמות שכנים", rel: "מז׳ור ומינור באותו מספר" };
  var curated = [], auto = [];
  try { curated = W.resolve(DATA, window.WORDPLAY_LINKS || []); } catch (e) { curated = []; }
  try { auto = W.autoLinks(DATA, { limit: 120, minConf: "mid" }); } catch (e) { auto = []; }
  var ALL = W.merge(curated, auto);
  var f = { type: "all", compat: false, genre: "all" }, shown = 20, run = null, list = ALL;

  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var ic = function (id) { return '<svg class="i" aria-hidden="true"><use href="#i-' + id + '"/></svg>'; };
  function hl(title, phrase) {
    var t = String(title), low = t.toLowerCase(), p = String(phrase || "").replace(/[?!.]+$/, "").trim();
    var cands = p ? [p].concat(p.split(/\s+/).map(function (w) { return w.replace(/[?!.,]/g, ""); }).filter(function (w) { return w.length >= 2; }).sort(function (a, b) { return b.length - a.length; })) : [];
    for (var i = 0; i < cands.length; i++) {
      var k = low.indexOf(cands[i].toLowerCase());
      if (k >= 0) return esc(t.slice(0, k)) + '<mark class="wp-w">' + esc(t.slice(k, k + cands[i].length)) + "</mark>" + esc(t.slice(k + cands[i].length));
    }
    return esc(t);
  }
  function words(l) { var p = String(l.word || "").split(/\s+(?:→|=)\s+/); return { a: p[0], b: p[1] || p[0] }; }
  function hype(n) {
    var s = '<span class="wp-hype" role="img" aria-label="הייפ ' + n + ' מתוך 9">';
    for (var i = 1; i <= 9; i++) s += '<i class="' + (i <= n ? "on" : "") + '"></i>';
    return s + "<b>" + (n >= 8 ? "פיצוץ" : n >= 6 ? "חזק" : "נעים") + "</b></span>";
  }
  function mixLine(m) {
    var t = m.tempoMode && m.tempoMode !== "1:1" ? "יחס קצב 2:1" : (m.tempoDiffPct ? "הפרש קצב " + m.tempoDiffPct + "%" : "אותו קצב");
    var k = m.rel ? REL[m.rel] : "סולמות מתנגשים";
    var en = m.dE >= 1 ? "האנרגיה עולה" : m.dE >= -1 ? "האנרגיה נשמרת" : "האנרגיה יורדת";
    return '<div class="wp-mix">' + (m.compatible ? '<span class="ok">' + ic("check") + "תואם · " + k + " · " + t + "</span>" : '<span class="no">' + k + " · " + t + "</span>") +
      '<span class="tech">' + esc(m.technique_he || m.technique) + "</span><span>" + en + "</span></div>";
  }
  function row(t, side, w) {
    return '<div class="wp-row"><span class="wp-tag ' + side + '">' + (side === "a" ? "A" : "B") + '</span><div class="wp-tx"><bdi class="wp-t">' + hl(t.t, w) + '</bdi><span class="wp-meta"><bdi>' + esc(String(t.a).split(",")[0]) + "</bdi> · " + esc(GN[t.g] || t.g) + "</span></div></div>";
  }
  function cardHTML(l, n) {
    var A = DATA[l.ai], B = DATA[l.bi], w = words(l), live = run && run.link === l;
    return '<article class="wp-card" data-wi="' + n + '" style="--d:' + Math.min(n % 20, 10) * 40 + 'ms">' +
      '<div class="wp-head"><span class="wp-type t-' + esc(l.type) + '">' + esc(l.type_he || l.type) + "</span>" + (l.src === "curated" ? '<span class="wp-src">' + ic("spark") + "נבחר ביד</span>" : '<span class="wp-src">אוטומטי</span>') + hype(l.hype) + "</div>" +
      row(A, "a", w.a) + '<div class="wp-arrow" aria-hidden="true">↓</div>' + row(B, "b", w.b) +
      (l.why_he ? '<p class="why">' + ic("spark") + "<span>" + esc(l.why_he) + "</span></p>" : "") +
      '<ol class="wp-plan"><li><b class="a">A</b><span>' + esc(l.cueA && l.cueA.he) + '</span></li><li><b class="b">B</b><span>' + esc(l.cueB && l.cueB.he) + "</span></li></ol>" +
      mixLine(l.mix) + '<p class="wp-note">' + esc(l.note_he || "הערכה לפי מבנה טיפוסי של הסגנון: לבדוק באוזן") + "</p>" +
      '<div class="c-acts"><button class="btn pri" type="button" data-wact="play" aria-pressed="' + !!live + '">' + ic(live ? "pause" : "play") + "<span>" + (live ? "עצור מעבר" : "נגן מעבר") + '</span></button><button class="btn n" type="button" data-wact="mixer">' + ic("sliders") + "<span>פתח במיקסר</span></button></div></article>";
  }

  /* ---------- view ---------- */
  var view = document.createElement("section");
  view.className = "wp";
  var types = ["all"].concat(["chain", "answer", "lang", "same", "count", "theme"].filter(function (t) { return ALL.some(function (l) { return l.type === t; }); }));
  var gset = {}; ALL.forEach(function (l) { gset[DATA[l.ai].g] = 1; gset[DATA[l.bi].g] = 1; });
  view.innerHTML =
    '<header class="lt"><div class="lt-t"><p class="eyebrow"><svg class="logo" viewBox="0 0 22 14" aria-hidden="true"><circle class="la" cx="7" cy="7" r="6.5"/><circle class="lb" cx="15" cy="7" r="6.5"/></svg>מעבדת המשאפים</p><h1>מעברי מילים</h1></div>' +
    '<button class="hbtn glass" type="button" data-act="source" aria-label="מאיפה מגיע השמע">' + ic("wave") + "</button></header>" +
    '<p class="sec-sub wp-sub" style="margin-top:-12px"></p>' +
    '<p class="wp-help">ההוק של שיר A נוחת על מילה, ושיר B נכנס וממשיך או עונה לה. ההדגמה כאן מתנגנת מתוך קטעי תצוגה מקדימה של 30 שניות, אז היא נותנת את התחושה של המעבר; את הקיו המדויק על המילה עושים על הדקים שלך, לפי התוכנית שבכרטיס.</p>' +
    '<div class="wp-filters"><div class="chips" role="group" aria-label="סוג מעבר">' + types.map(function (t) { return '<button class="chip" type="button" data-wf="type" data-v="' + t + '" aria-pressed="' + (t === "all") + '">' + (t === "all" ? "הכל" : esc(W.TYPE_HE[t])) + "</button>"; }).join("") + "</div>" +
    '<div class="wp-frow"><button class="tchip" type="button" data-wf="compat" aria-pressed="false">' + ic("check") + 'רק תואמים בסולם ובקצב</button><select class="wp-sel" data-wf="genre" aria-label="סגנון"><option value="all">כל הסגנונות</option>' +
    Object.keys(GN).filter(function (g) { return gset[g]; }).map(function (g) { return '<option value="' + g + '">' + esc(GN[g]) + "</option>"; }).join("") + "</select></div></div>" +
    '<div class="wp-list"></div><button class="btn n wp-more" type="button" data-wact="more" hidden>להציג עוד</button>';
  var $l = view.querySelector(".wp-list"), $more = view.querySelector(".wp-more"), $sub = view.querySelector(".wp-sub");

  function filtered() {
    return ALL.filter(function (l) {
      if (f.type !== "all" && l.type !== f.type) return false;
      if (f.compat && !l.mix.compatible) return false;
      if (f.genre !== "all" && DATA[l.ai].g !== f.genre && DATA[l.bi].g !== f.genre) return false;
      return true;
    });
  }
  function render() {
    list = filtered();
    var nc = list.filter(function (l) { return l.src === "curated"; }).length;
    $sub.textContent = list.length + " מעברים · " + nc + " נבחרו ביד";
    $l.innerHTML = list.length ? list.slice(0, shown).map(cardHTML).join("") : '<p class="wp-help">אין מעברים שמתאימים לסינון הזה. אפשר לבטל את "רק תואמים" או לבחור סגנון אחר.</p>';
    $more.hidden = list.length <= shown;
  }
  function paint(btn, on) {
    if (!btn) return;
    btn.setAttribute("aria-pressed", String(!!on));
    btn.innerHTML = ic(on ? "pause" : "play") + "<span>" + (on ? "עצור מעבר" : "נגן מעבר") + "</span>";
  }

  /* ---------- transition player ---------- */
  function stopRun() {
    if (!run) return;
    clearInterval(run.iv); clearTimeout(run.to); if (run.raf) cancelAnimationFrame(run.raf);
    var b = run.btn; run = null; paint(b, false);
  }
  function ramp(r, ms, done) {
    var t0 = performance.now();
    (function step(now) {
      if (run !== r) return;
      var x = Math.min(1, Math.max(0, (now - t0) / Math.max(1, ms)));
      E.setCrossfader(x);
      if (x < 1) r.raf = requestAnimationFrame(step); else if (done) done();
    })(t0);
  }
  function later(r, ms, fn) { r.to = setTimeout(function () { if (run === r) fn(); }, ms); }
  function fire(r) {
    r.fired = true;
    if (E.holdClean) E.holdClean(12000);   /* a word handoff needs both full mixes, no vocal clean-up during the overlap */
    var pl = r.plan;
    if (pl.style === "spinback") {            /* stop-and-drop: A out on the word, B lands one beat later on the 1 */
      E.setCrossfader(1);
      later(r, Math.round(pl.beat * 1000), function () { E.play("B"); later(r, 400, function () { E.pause("A"); }); });
      return;
    }
    E.play("B");
    if (pl.style === "cut") { E.setCrossfader(1); later(r, 300, function () { E.pause("A"); }); return; }
    /* blend: 2-bar crossfader ride; echo: a one-beat fall-away like an echo tail */
    ramp(r, pl.xfMs, function () { later(r, pl.style === "echo" ? Math.round(pl.bar * 1000) : 200, function () { E.pause("A"); }); });
  }
  function tick(r) {
    if (run !== r) return;
    var st = E.state(), a = st.A || {}, b = st.B || {};
    if (!r.fired) {
      if (a.busy || a.buffering || !a.playing) {
        if (r.p0 != null && !a.playing && !a.busy && !a.buffering) stopRun();          /* paused from elsewhere */
        else if (r.p0 == null && Date.now() - r.start > 9000) stopRun();               /* never started */
        return;
      }
      if (r.p0 == null) { r.p0 = a.pos; return; }
      if (a.pos - r.p0 >= r.plan.T * (r.plan.rates.A || 1) - 0.02) fire(r);             /* pos is track time; T is real time at the synced rate */
    } else if (!a.playing && !b.playing && !b.busy && !b.buffering) stopRun();
  }
  function playTransition(l, btn) {
    E.gesture();                                   /* first, synchronously (iOS) */
    if (run && run.link === l) { E.pauseAll(); stopRun(); if (App.refresh) App.refresh(); return; }
    stopRun();
    var A = DATA[l.ai], B = DATA[l.bi], plan = W.previewPlan(l, DATA);
    App.play(App.pairAny(A, B), null, { sync: plan.sync });     /* load only: A → deck A, B → deck B (halts both) */
    E.setCrossfader(0);
    E.playOnly("A");
    var r = run = { link: l, btn: btn, plan: plan, p0: null, fired: false, start: Date.now() };
    paint(btn, true);
    r.iv = setInterval(function () { tick(r); }, 40);
    if (App.refresh) App.refresh();
  }
  function openInMixer(l, btn) {
    E.gesture(); stopRun();
    var plan = W.previewPlan(l, DATA);
    App.play(App.pairAny(DATA[l.ai], DATA[l.bi]), null, { sync: plan.sync, mixer: true, opener: btn });
  }

  view.addEventListener("click", function (ev) {
    var t = ev.target.closest("[data-wact],[data-wf]"); if (!t || !view.contains(t)) return;
    var act = t.dataset.wact, wf = t.dataset.wf;
    if (act === "more") { shown += 20; render(); return; }
    if (act) { var card = t.closest(".wp-card"), l = card && list[+card.dataset.wi]; if (!l) return; if (act === "play") playTransition(l, t); else if (act === "mixer") openInMixer(l, t); return; }
    if (wf === "type") { f.type = t.dataset.v; view.querySelectorAll('[data-wf="type"]').forEach(function (b) { b.setAttribute("aria-pressed", String(b === t)); }); }
    else if (wf === "compat") { f.compat = !f.compat; t.setAttribute("aria-pressed", String(f.compat)); }
    else return;
    shown = 20; render();
  });
  view.addEventListener("change", function (ev) { if (ev.target.dataset.wf === "genre") { f.genre = ev.target.value; shown = 20; render(); } });

  var css = document.createElement("style");
  css.textContent =
    ".wp-help{font-size:14px;line-height:20px;color:var(--label-2);margin:0 0 14px}.wp-filters{display:grid;gap:10px;margin-bottom:14px;min-width:0}" +
    ".wp .chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.wp .chips::-webkit-scrollbar{display:none}.wp .chip[aria-pressed=true]{background:var(--accent);color:#fff}" +
    ".wp-frow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.wp-sel{height:36px;border-radius:18px;border:0;background:var(--card-hi);color:var(--label);padding:0 12px;font:inherit;font-size:14px;max-width:100%}" +
    ".wp-list{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr))}" +
    ".wp-card{position:relative;background:var(--card);border-radius:24px;padding:14px;display:grid;gap:10px;min-width:0}" +
    ".wp-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.wp-type{font-size:12px;font-weight:700;padding:3px 9px;border-radius:10px;background:var(--accent-tint);color:var(--accent-ink)}" +
    ".wp-type.t-answer{background:var(--beat-tint);color:var(--beat-ink)}.wp-type.t-lang{background:var(--violet-tint);color:var(--violet-ink)}.wp-type.t-same,.wp-type.t-count{background:var(--ok-tint);color:var(--ok-ink)}.wp-type.t-theme{background:var(--fill);color:var(--label-2)}" +
    ".wp-src{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--label-2)}.wp-src .i{width:12px;height:12px}" +
    ".wp-hype{margin-inline-start:auto;display:inline-flex;align-items:center;gap:2px}.wp-hype i{width:5px;height:14px;border-radius:3px;background:var(--fill)}.wp-hype i.on{background:linear-gradient(var(--vocal),var(--accent))}.wp-hype b{font-size:12px;margin-inline-start:6px;color:var(--label-2)}" +
    ".wp-row{display:flex;gap:10px;align-items:center;min-width:0}.wp-tx{min-width:0}.wp-tag{flex:none;width:26px;height:26px;border-radius:13px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;background:var(--vocal)}.wp-tag.b{background:var(--beat)}" +
    ".wp-t{display:block;font-size:17px;font-weight:700;line-height:22px;overflow-wrap:anywhere}.wp-meta{display:block;font-size:13px;color:var(--label-2)}.wp-arrow{margin:-6px 0 -6px 8px;color:var(--label-2);font-size:13px}" +
    ".wp-w{background:none;color:var(--accent-ink);font-weight:800;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}" +
    ".wp-plan{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:14px;line-height:19px}.wp-plan li{display:flex;gap:8px}.wp-plan b{flex:none;font-size:11px;width:20px;height:20px;border-radius:10px;display:grid;place-items:center;color:#fff;background:var(--vocal)}.wp-plan b.b{background:var(--beat)}" +
    ".wp-mix{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}.wp-mix span{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:9px;background:var(--fill)}.wp-mix .i{width:12px;height:12px}.wp-mix .ok{background:var(--good-tint);color:var(--good-ink)}.wp-mix .tech{background:var(--warn-tint);color:var(--warn-ink)}" +
    ".wp-note{margin:0;font-size:12px;color:var(--label-2)}.wp-card .btn.pri[aria-pressed=true]{background:var(--accent);color:#fff}.wp-more{margin:14px auto 0;display:flex}" +
    "@media (prefers-reduced-motion:no-preference){.wp-card{animation:wpIn .5s cubic-bezier(.3,1.35,.45,1) both;animation-delay:var(--d,0ms)}@keyframes wpIn{from{opacity:0;transform:translateY(14px);filter:blur(10px)}}}";
  document.head.appendChild(css);

  App.addTab({
    id: "words", label: "מעברים", view: view, onShow: render,
    svg: '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5h11a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2H9l-4 3.5v-3.5H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2z"/><path d="M17 9.5h3a2 2 0 0 1 2 2v4.5a2 2 0 0 1-2 2h-1v3l-3.5-3H12"/></svg>'
  });

})();
