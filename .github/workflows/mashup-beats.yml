name: Mashup Lab beat grids

# Measures the beat grid (tempo, first beat, bar start) of every Mashup Lab preview on GitHub's servers with the
# "Beat This!" tracker and commits docs/mashup-lab/beats.json (numbers only, no audio). The app uses these grids to
# start both decks on one audio clock, so the vocal sits exactly on the beat. Only new or changed links are analysed.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Re-analyse every preview"
        type: boolean
        default: false
      limit:
        description: "Max previews per shard (0 = all)"
        default: "0"
  push:
    branches:
      - claude/dj-course-music-agents-suitm3
    paths:
      - docs/mashup-lab/previews.json
      - tools/mashup_lab_beats.py
      - .github/workflows/mashup-beats.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: mashup-beats
  cancel-in-progress: true

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache@v4
        id: cache
        with:
          path: final0.ckpt
          key: beat-this-final0-v1
      - name: Download the Beat This! checkpoint once (official server, else a Hugging Face mirror of the same file)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          ok=0
          for u in "https://cloud.cp.jku.at/public.php/dav/files/7ik4RrBKTS273gp/final0.ckpt" \
                   "https://huggingface.co/rtikw/localmusic-assets/resolve/main/analysis/beat_this-final0.ckpt"; do
            for i in 1 2 3; do
              if curl -fsSL --retry 2 --retry-delay 10 -A "Mozilla/5.0" -o final0.ckpt "$u" && [ "$(stat -c %s final0.ckpt)" -gt 50000000 ]; then ok=1; echo "downloaded from $u"; break 2; fi
              echo "attempt $i failed for $u"; sleep $((15 * i))
            done
          done
          [ "$ok" = 1 ]
      - name: Checkpoint fingerprint (loaded with torch weights_only, so the file cannot run code)
        run: ls -la final0.ckpt && sha256sum final0.ckpt
      - uses: actions/upload-artifact@v4
        with:
          name: model
          path: final0.ckpt
          retention-days: 3

  analyze:
    needs: model
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: model
      - name: Install ffmpeg and the beat tracker (CPU)
        timeout-minutes: 12
        run: |
          command -v ffmpeg || (timeout 300 sudo apt-get update -qq && timeout 300 sudo apt-get install -y -qq ffmpeg)
          for i in 1 2 3; do timeout 400 pip install -q --default-timeout 60 --retries 5 torch torchaudio --index-url https://download.pytorch.org/whl/cpu && break; done
          for i in 1 2 3; do timeout 300 pip install -q --default-timeout 60 --retries 5 beat-this soxr einops rotary-embedding-torch numpy && break; done
          python -c "import beat_this.inference, torch; print('beat_this ok, torch', torch.__version__)"
      - name: Use the newest beat grids (only missing previews are analysed)
        run: git fetch -q origin "${GITHUB_REF_NAME}" && git checkout FETCH_HEAD -- docs/mashup-lab/beats.json 2>/dev/null || echo "no beats.json yet"
      - name: Self-test of the grid fit
        run: python tools/mashup_lab_beats.py selftest
      - name: Analyse previews (shard ${{ matrix.shard }})
        shell: bash
        run: |
          set -o pipefail
          python -u tools/mashup_lab_beats.py analyze --shard ${{ matrix.shard }} --shards 8 --checkpoint final0.ckpt \
            --out beats-${{ matrix.shard }}.json --limit ${{ inputs.limit || 0 }} ${{ inputs.force && '--force' || '' }} 2>&1 | tee log-${{ matrix.shard }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beats-${{ matrix.shard }}
          path: |
            beats-${{ matrix.shard }}.json
            log-${{ matrix.shard }}.txt
          if-no-files-found: ignore
          retention-days: 7

  merge:
    needs: analyze
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q numpy
      - uses: actions/download-artifact@v4
        with:
          path: parts
          pattern: beats-*
          merge-multiple: true
      - name: Merge into docs/mashup-lab/beats.json
        run: |
          mkdir -p tools/reports
          (for f in parts/log-*.txt; do echo "== $f"; tail -n 60 "$f"; done) > tools/reports/mashup-beats-log.txt 2>/dev/null || true
          python tools/mashup_lab_beats.py merge --parts parts --out docs/mashup-lab/beats.json --report tools/reports/mashup-beats-report.json || echo "merge found no grids"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/reports/mashup-beats-log.txt
          [ -f docs/mashup-lab/beats.json ] && git add docs/mashup-lab/beats.json
          [ -f tools/reports/mashup-beats-report.json ] && git add tools/reports/mashup-beats-report.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Mashup Lab: beat grids from the previews"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Redeploy the site
        if: ${{ hashFiles('docs/mashup-lab/beats.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"
